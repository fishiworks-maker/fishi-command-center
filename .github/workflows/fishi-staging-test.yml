
name: FISHI Staging Write Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  staging-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Google Sheets libraries
        run: pip install google-api-python-client google-auth

      - name: Write one test record safely
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import os
          import google.auth
          from googleapiclient.discovery import build

          TEST_ID = "FISHI_TEST_001"
          TAB = "Import_Staging"

          credentials, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/spreadsheets"]
          )

          service = build(
              "sheets", "v4",
              credentials=credentials
          )

          spreadsheet_id = os.environ["GOOGLE_SHEET_ID"]

          # Read existing staging records
          existing = service.spreadsheets().values().get(
              spreadsheetId=spreadsheet_id,
              range=f"'{TAB}'!A:A"
          ).execute()

          existing_ids = {
              row[0]
              for row in existing.get("values", [])
              if row
          }

          # Avoid duplicate test records
          if TEST_ID in existing_ids:
              print("Test record already exists. Skipping.")
          else:
              record = [
                  TEST_ID,
                  "FISHI_TEST_BATCH_001",
                  "TEST_POST_001",
                  "",
                  "",
                  "FISHI Command Center connection test",
                  "{}",
                  "",
                  "TEST",
                  "Automated test record - not a real post"
              ]

              result = service.spreadsheets().values().append(
                  spreadsheetId=spreadsheet_id,
                  range=f"'{TAB}'!A:J",
                  valueInputOption="RAW",
                  insertDataOption="INSERT_ROWS",
                  body={"values": [record]}
              ).execute()

              print("SUCCESS! Test record written.")
              print(result.get("updates", {}).get("updatedRange"))

          PY
