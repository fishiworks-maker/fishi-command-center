
name: FISHI Google Sheets Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Sheets library
        run: pip install google-api-python-client google-auth

      - name: Test spreadsheet access
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: |
          python - <<'PY'
          import os
          import google.auth
          from googleapiclient.discovery import build

          credentials, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"]
          )

          service = build("sheets", "v4", credentials=credentials)

          result = service.spreadsheets().get(
              spreadsheetId=os.environ["GOOGLE_SHEET_ID"],
              fields="properties(title),sheets(properties(title))"
          ).execute()

          print("SUCCESS! Connected to:", result["properties"]["title"])
          print("Available tabs:")
          for sheet in result.get("sheets", []):
              print("-", sheet["properties"]["title"])
              
          print("\nImport_Staging column headers:")

          headers = service.spreadsheets().values().get(
              spreadsheetId=os.environ["GOOGLE_SHEET_ID"],
              range="'Import_Staging'!1:1"
          ).execute()

          for column, header in enumerate(
              headers.get("values", [[]])[0], start=1
          ):
              print(f"Column {column}: {header}")

          PY
